<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agent City</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff8ec;--ink:#5a4a42;--pink:#ff8fb1;--sand:#f0dcc0}
*{box-sizing:border-box}body{margin:0;background:#bfe8ff;color:var(--ink);font:15px/1.4 Fredoka,"Trebuchet MS",sans-serif;overflow:hidden}
canvas{display:block}
.card{background:var(--cream);border-radius:20px;box-shadow:0 6px 0 #0000001a,0 10px 24px #0000001f}
#bar{position:fixed;left:14px;top:14px;padding:8px 12px;display:flex;gap:6px;align-items:center}
#bar b{font-size:19px;margin-right:6px}
#inv{position:fixed;right:14px;top:14px;width:262px;max-height:52vh;overflow:auto;padding:12px 14px}
#inv h3{margin:0 0 6px;font-size:17px}.it{padding:8px 0;border-top:2px dashed var(--sand)}.it small{color:#9a8a80;display:block;max-height:36px;overflow:hidden}
button{font:inherit;background:var(--pink);color:#fff;border:0;border-radius:99px;padding:5px 12px;margin:3px 3px 0 0;cursor:pointer;box-shadow:0 3px 0 #d96b92}
button:hover{filter:brightness(1.07)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #d96b92}
button.q{background:#c9b8a6;box-shadow:0 3px 0 #a8978a}button.g{background:#5fc99a;box-shadow:0 3px 0 #3ea87a}
#fade{position:fixed;inset:0;background:radial-gradient(circle,#fff8ec,#ffc6dc);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 18px;white-space:nowrap}
#prompt{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);padding:8px 18px;display:none;font-weight:600}
#map{position:fixed;left:14px;bottom:14px;padding:6px}#map canvas{border-radius:14px}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #5a4a42;display:none}
.dlg{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,94vw);padding:20px;max-height:92vh;overflow:auto}
.dlg h2{margin:0 0 4px;font-size:24px}.mute{color:#9a8a80}
.dlg textarea,.dlg input{width:100%;margin-top:8px;background:#fff;color:var(--ink);border:3px solid var(--sand);border-radius:14px;padding:9px;font:inherit;outline:0}
.dlg textarea{height:84px}.dlg textarea:focus,.dlg input:focus{border-color:var(--pink)}
#out{white-space:pre-wrap;background:#fdf0dc;border-radius:14px;padding:10px;margin-top:10px;max-height:170px;overflow:auto}
#msg,#nmsg{color:#d96b92;min-height:22px}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:8px 6px 0 0;cursor:pointer;border:4px solid #fff;box-shadow:0 2px 0 #0002}.sw.on{border-color:var(--ink)}

.dlg,#gm{z-index:30}#appr{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:340px;max-height:40vh;overflow:auto;padding:10px 14px;display:none;z-index:20}
.it small{white-space:pre-wrap}.chk{display:block;font-size:14px}.chk small{color:#9a8a80}.chk input{width:auto;margin:0 6px 0 0}
#ntools{max-height:130px;overflow:auto;margin-top:6px}select{width:100%;margin-top:8px;padding:8px;border-radius:14px;border:3px solid var(--sand);font:inherit;background:#fff;color:var(--ink)}
#gm{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center}#gc{padding:18px;text-align:center}
.mg,.mg3{display:grid;gap:8px;justify-content:center}.mg{grid-template-columns:repeat(4,72px)}.mg3{grid-template-columns:repeat(3,84px)}
.mc{font-size:30px;width:100%;height:72px;border-radius:16px;background:#fff;color:inherit;box-shadow:0 4px 0 #0002;margin:0;padding:0}.mc.ok{background:#c8f5d8}

#dlg{width:min(760px,94vw)}#out{max-height:52vh}#out.md{white-space:normal}.md{line-height:1.5}
.md h4{margin:12px 0 4px;font-size:16px}.md p{margin:5px 0}.md ul,.md ol{margin:4px 0;padding-left:22px}.md li{margin:3px 0}
.md table{border-collapse:collapse;font-size:13px;display:block;overflow:auto;margin:6px 0}.md th,.md td{border:1px solid #e6d3b6;padding:4px 8px;text-align:left}.md th{background:#fdf0dc}
.md a{color:#d6457a}.md code{background:#f3e6cc;padding:0 4px;border-radius:4px}.md hr{border:0;border-top:2px dashed var(--sand)}
.it summary{cursor:pointer;list-effect:none}.it details .md{font-size:13px;max-height:220px;overflow:auto;margin-top:4px}
#schips button{font-size:13px}
#prompt{bottom:128px}
#cmdbar{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);width:min(640px,calc(100vw - 420px));min-width:300px;padding:8px;z-index:10}#cmdbar .row{display:flex;gap:6px;align-items:center}
#att:not(:empty){font-size:13px;padding:0 8px 6px}#att button{font-size:12px;padding:1px 8px}
#cmd{flex:1;border:3px solid var(--sand);border-radius:99px;padding:9px 16px;font:inherit;color:var(--ink);background:#fff;outline:0}#cmd:focus{border-color:var(--pink)}
#cmdbar button{margin:0;white-space:nowrap}
#mis{position:fixed;left:14px;top:72px;width:300px;max-height:calc(100vh - 290px);overflow:auto;padding:10px 14px;display:none}
#mis h3{margin:0 0 4px;font-size:17px}.ms{padding:8px 0;border-top:2px dashed var(--sand)}.ms button{font-size:12px;padding:3px 9px}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;background:#eadfce;margin-left:4px;white-space:nowrap}.pill.running,.pill.planning,.pill.reviewing,.pill.queued{background:#ffe08f}.pill.done{background:#c8f5d8}.pill.failed,.pill.stopped{background:#ffc6d3}
.chips{margin:4px 0 2px;font-size:14px;line-height:1.9}.chip{display:inline-block;padding:0 6px;border-radius:99px;background:#fff;margin-right:3px;box-shadow:0 2px 0 #0001}.chip.running{background:#ffe08f;animation:pulse 1s infinite alternate}.chip.done{background:#c8f5d8}.chip.failed{background:#ffc6d3}.chip.skipped{opacity:.5}
@keyframes pulse{to{filter:brightness(1.12);transform:scale(1.06)}}
#rdlg{width:min(760px,94vw)}#rbody .md{font-size:14px}#out .turn{margin:6px 0}#out .you{background:#fff;border-radius:12px;padding:6px 10px;font-weight:600}#out .bot{padding:2px 4px}
.it .from{font-size:12px;color:#9a8a80}.it button{font-size:12px;padding:3px 10px}#rbody details{border-top:2px dashed var(--sand);padding:6px 0}#rbody summary{cursor:pointer}
.rep{background:#fdf0dc;border-radius:14px;padding:4px 14px;margin:8px 0}
.fact{display:flex;gap:6px;align-items:center;border-top:2px dashed var(--sand);padding:5px 0}.fact span{flex:1}.fact button{padding:1px 8px;font-size:12px}
</style></head><body>
<div id="bar" class="card"><b>Agent City</b><button id="view" class="g">First person (V)</button><button id="add">New shop</button><button id="mem" class="q">Memory</button><button id="goo" class="q">Connect Google</button></div>
<div id="mis" class="card"><h3>Missions</h3><div id="mlist"></div></div>
<div id="cmdbar" class="card"><div id="att"></div><div class="row"><input id="cmd" maxlength="2000" placeholder="Tell the city what to do... (Enter)"><button id="cmdex" class="q" title="Show an example command">Example</button><button id="cmdgo">Go</button></div></div>
<div id="rdlg" class="dlg card"><h2 id="rt"></h2><div id="rg" class="mute"></div><div id="rbody"></div><div><button id="rrun" class="g">Run again</button><button id="rx" class="q">Close</button></div></div>
<div id="mdlg" class="dlg card"><h2>City memory</h2><div class="mute">Every agent knows these facts about you. The Mayor and agents add to it as they learn.</div>
  <div id="facts"></div><input id="fnew" maxlength="300" placeholder="Add a fact, e.g. I'm a CS student in Lahore, I know Python and PyTorch"><div><button id="fadd">Remember</button><button id="mx" class="q">Close</button></div>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="autoself"> Auto-send emails addressed to <b>myself</b> (no approval card). Emails to anyone else always wait for you.</label></div>
<div id="inv" class="card"><h3>Results</h3><div id="items"></div></div>
<div id="map" class="card"><canvas id="mc" width="170" height="170"></canvas></div>
<div id="fade"></div><div id="prompt" class="card"></div><div id="hint" class="card"></div><div id="cross"></div>
<div id="appr" class="card"></div>
<div id="dlg" class="dlg card">
  <h2 id="dt"></h2><div id="pp" class="mute" style="font-size:13px"></div><div id="de" class="mute"></div><div id="msg"></div>
  <div id="games"></div>
  <div id="out"></div>
  <div id="agentui"><textarea id="dp" placeholder="Ask this shop something... (Enter to send, Shift+Enter for a new line)"></textarea><div><button id="run">Ask</button><button id="clr" class="q">Clear conversation</button></div></div>
  <div><button id="del" class="q">Remove shop</button><button id="x" class="q">Close</button></div>
</div>
<div id="ndlg" class="dlg card">
  <h2>New shop</h2>
  <select id="nkind"><option value="agent">AI agent shop</option><option value="game">Game shop</option></select>
  <input id="nn" maxlength="24" placeholder="Name (e.g. Translator)">
  <div id="nagent">
    <select id="npre"></select>
    <textarea id="ns" placeholder="PURPOSE: what is this agent for and how should it behave? (e.g. You help me prepare for interviews...)"></textarea>
    <div class="mute" style="margin-top:6px">Tools it may use (its abilities). The Mayor can use this shop in missions right away.</div><div id="ntools"></div>
  </div>
  <div id="ngames" style="display:none"><div class="mute" style="margin-top:6px">Games on its menu:</div>
    <label class="chk"><input type="checkbox" value="snake" checked> Snake</label><label class="chk"><input type="checkbox" value="memory" checked> Memory Match</label><label class="chk"><input type="checkbox" value="whack" checked> Whack-a-Mole</label></div>
  <div id="sws"></div><div id="nmsg"></div>
  <div><button id="nok">Build it here</button><button id="nx" class="q">Cancel</button></div>
</div>
<div id="gm"><div id="gc" class="card"><h2 id="gt" style="margin:0 0 8px"></h2><div id="gb"></div><div id="bs" class="mute"></div><button id="gx" class="q">Close</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const HINT='Enter: command the city   |   WASD walk   |   E interact   |   drag to look   |   V view';
const FONT='Fredoka, Trebuchet MS, sans-serif';
const lotPos=i=>{const b=Math.floor(i/4),q=i%4;return{x:12*(b%4)+4+4*(q%2),z:12*Math.floor(b/4)+4+4*Math.floor(q/2)};};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const $=id=>document.getElementById(id);
let S=null,off=0,ui=null,pl=null,lastSent=0,fp=false;
const api=(p,b,m)=>fetch('/api/'+p,b?{method:m||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:m?{method:m}:{}).then(r=>r.json());
async function poll(){try{S=await api('state');off=S.now-Date.now();if(!pl)pl={x:S.player.x,z:S.player.z};hud();}catch(e){}}
setInterval(poll,400);poll();
$('hint').textContent=HINT;
const flash=t=>{$('hint').textContent=t;setTimeout(()=>$('hint').textContent=HINT,2400);};

// ---------- HUD ----------
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){
  const inline=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(>])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const o=[];let list=null,tbl=false;const end=()=>{if(list){o.push(`</${list}>`);list=null;}if(tbl){o.push('</tbody></table>');tbl=false;}};
  for(const l of String(src).replace(/\r/g,'').split('\n')){let m;
    if(/^\s*\|.*\|\s*$/.test(l)){if(/^[\s|:-]+$/.test(l)&&tbl)continue;const c=l.trim().slice(1,-1).split('|').map(x=>x.trim());
      if(!tbl){end();tbl=true;o.push('<table><thead><tr>'+c.map(x=>`<th>${inline(x)}</th>`).join('')+'</tr></thead><tbody>');}else o.push('<tr>'+c.map(x=>`<td>${inline(x)}</td>`).join('')+'</tr>');continue;}
    if(tbl)end();
    if((m=l.match(/^#{1,4}\s+(.*)/))){end();o.push(`<h4>${inline(m[1])}</h4>`);}
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=='ul'){end();o.push('<ul>');list='ul';}o.push(`<li>${inline(m[1])}</li>`);}
    else if((m=l.match(/^\s*(\d+)[.)]\s+(.*)/))){if(list!=='ol'){end();o.push(`<ol start="${m[1]}">`);list='ol';}o.push(`<li>${inline(m[2])}</li>`);}
    else if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){end();o.push('<hr>');}
    else if(!l.trim())end();
    else if(list&&/^\s{2,}\S/.test(l))o[o.length-1]=o[o.length-1].replace(/<\/li>$/,'<br>'+inline(l.trim())+'</li>');
    else{end();o.push(`<p>${inline(l)}</p>`);}}
  end();return o.join('');
}
function setOut(t,plain){const o=$('out');if(o.dataset.raw===t&&o.dataset.p===String(!!plain))return;o.dataset.raw=t;o.dataset.p=String(!!plain);if(plain){o.className='';o.textContent=t;}else{o.className='md';o.innerHTML=md(t);}}
function hud(){
  let h='';
  for(const it of [...S.inv].reverse()){const who=S.cfg[it.from]?.name||it.from;
    h+=`<div class="it"><div class="from">${esc(who)} · ${new Date(it.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><details ontoggle="loadItem(this,${it.id})"><summary><b>${esc(it.title||'Result')}</b></summary><div class="md"><p class="mute">Loading...</p></div></details>`
      +`<button title="Use this result in a new command for the Mayor" onclick="followUp(${it.id})">Follow up</button><button class="q" onclick="copyItem(${it.id})">Copy</button><button class="q" onclick="dropItem(${it.id})">Delete</button></div>`;}
  const el=$('items');if(el.dataset.sig!==h){el.dataset.sig=h;el.innerHTML=h||'<small class="mute">Nothing yet. Give the city a command, or ask a shop.</small>';}
  let a='';for(const p of S.approvals)a+=`<div class="it"><b>Send this email?</b><small>To: ${esc(p.to)}\nSubject: ${esc(p.subject)}\n\n${esc(p.body.slice(0,400))}</small><button onclick="decide(${p.id},true)">Send</button><button class="q" onclick="decide(${p.id},false)">Discard</button></div>`;
  const ap=$('appr');if(ap.dataset.sig!==a){ap.dataset.sig=a;ap.innerHTML=a;ap.style.display=a?'block':'none';}
  $('goo').textContent=S.google.connected?'Google connected':'Connect Google';
  missionsHud();if(rid)refreshReport();if($('mdlg').style.display==='block')factsHud();
  if(ui&&S.shops[ui]){const s=S.shops[ui];$('de').textContent=`Energy ${S.energy}%`+(s.task?` · ${Math.round(s.task.progress)}%`:'')+(s.task?.mission?` · working on mission "${s.task.mission}"`:'')+(s.queued?` · ${s.queued} more in queue`:'');
    chatHud();}
}
// shop conversation: the last turns with this shop, plus a live status line while it works
let chatSig='',chatBusy=false;
async function chatHud(force){
  const s=S.shops[ui];if(!s||chatBusy)return;const sig=ui+'|'+s.turns+'|'+(s.task?s.task.status+s.task.prompt:'');if(!force&&sig===chatSig)return;chatSig=sig;chatBusy=true;
  try{const id=ui,r=await api(`agent/${id}/chat`);if(id!==ui)return;
    let h=r.chat.map(t=>`<div class="turn"><div class="you">${esc(t.q)}</div><div class="bot md">${md(t.a)}</div></div>`).join('');
    if(s.task&&!s.task.mission)h+=`<div class="turn"><div class="you">${esc(s.task.prompt)}</div><div class="bot mute">Working: ${esc(s.task.status||'thinking...')}</div></div>`;
    const o=$('out');o.className='md';o.dataset.raw='';o.innerHTML=h||'<p class="mute">Ask anything this shop can do. It remembers this conversation and can look up earlier results.</p>';o.scrollTop=o.scrollHeight;
  }finally{chatBusy=false;}
}
// ---------- missions (the Mayor) ----------
const SLABEL={waiting:'waiting',running:'working',done:'done',failed:'failed',skipped:'skipped'},ACTIVE=['queued','planning','running','reviewing'];
const when=t=>{const d=new Date(t),td=new Date();return (d.toDateString()===td.toDateString()?'today ':d.toDateString()===new Date(+td+864e5).toDateString()?'tomorrow ':d.toLocaleDateString([], {weekday:'short'})+' ')+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});};
const sched=s=>s?(s.daily_at?`daily at ${s.daily_at}`:`every ${s.every_minutes>=60&&s.every_minutes%60===0?s.every_minutes/60+' h':s.every_minutes+' min'}`):'';
function missionsHud(){
  let h='';
  for(const m of S.missions){const act=ACTIVE.includes(m.status);
    h+=`<div class="ms"><div><b>${esc(m.title)}</b><span class="pill ${m.status}">${act?esc(m.phase||m.status):m.status}</span></div>`+(m.attached?`<small class="mute">with: ${esc(m.attached)}</small>`:'');
    if(m.steps.length)h+=`<div class="chips">${m.steps.map((s,i)=>`<span class="chip ${s.status}" title="${i+1}. ${SLABEL[s.status]||''}: ${esc(s.task)}">${esc(S.cfg[s.agent]?.name||s.agent)}</span>`).join('')}</div>`;
    if(m.error)h+=`<small class="mute">Problem: ${esc(m.error.slice(0,140))}</small><br>`;
    if(m.schedule)h+=`<small class="mute">Repeats ${sched(m.schedule)}${m.paused?' · paused':m.nextRun?' · next '+when(m.nextRun):''} · ${m.runs} run${m.runs===1?'':'s'}</small><br>`;
    h+=`<button onclick="openReport(${m.id})">${act?'Watch':'Report'}</button>`+(act?`<button class="q" onclick="mAct(${m.id},'stop')">Stop</button>`:`<button class="g" onclick="mAct(${m.id},'run')">Run</button>`)
      +(m.schedule?`<button class="q" onclick="mPause(${m.id},${!m.paused})">${m.paused?'Resume':'Pause'}</button>`:'')+`<button class="q" onclick="mDel(${m.id})">Delete</button></div>`;}
  const el=$('mlist');if(el.dataset.sig!==h){el.dataset.sig=h;el.innerHTML=h;}$('mis').style.display=S.missions.length?'block':'none';
}
const EXAMPLES=['Find internships in Lahore for a CS student who knows Python, save them to a new Google Sheet and email me the top 5',
  'What meetings do I have this week, and is there any free afternoon?',
  'Research the latest papers on LLM agents planning, find the research gaps, and email me a short summary',
  'Every morning at 9:00 find NEW AI internships open to Pakistan, append them to my last-used sheet and email me the list',
  'Check my unread emails from the last 2 days, add any meetings or deadlines to my calendar and give me a summary',
  'Remember: I am a CS student in Lahore, I know Python, PyTorch and React, and I want remote AI internships'];
let exi=0;$('cmdex').onclick=()=>{$('cmd').value=EXAMPLES[exi++%EXAMPLES.length];$('cmd').focus();};
let attach=null;
function showAttach(){$('att').innerHTML=attach?`Attached: <b>${esc(attach.title)}</b> <button class="q" onclick="unattach()">remove</button>`:'';}
window.unattach=()=>{attach=null;showAttach();};
window.followUp=id=>{const it=S.inv.find(x=>x.id===id);if(!it)return;attach={id,title:it.title||'result'};showAttach();document.exitPointerLock?.();$('cmd').focus();flash('Now say what to do with it, e.g. "save these to my sheet and email me the top 5"');};
async function command(){const goal=$('cmd').value.trim();if(!goal)return $('cmd').focus();const r=await api('missions',{goal,itemId:attach?.id});
  if(r.error)return flash(r.error);$('cmd').value='';attach=null;showAttach();$('cmd').blur();flash('The Mayor got it. Watch the couriers run.');poll();}
$('cmdgo').onclick=command;
$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();command();}else if(e.key==='Escape')$('cmd').blur();});
window.mAct=async(id,a)=>{const r=await api(`missions/${id}/${a}`,{});flash(r.error||(a==='run'?'Running it again ▶':'Stopping after the current step ⏹'));poll();};
window.mPause=async(id,p)=>{await api(`missions/${id}/pause`,{paused:p});poll();};
window.mDel=async id=>{if(!confirm('Delete this mission?'))return;await api('missions/'+id,{},'DELETE');if(rid===id)closeAll();poll();};
let rid=null,rsig='',rbusy=false;
window.openReport=id=>{closeAll();ui='report';rid=id;rsig='';document.exitPointerLock?.();$('rdlg').style.display='block';$('rbody').innerHTML='<p class="mute">Loading…</p>';refreshReport(true);};
async function refreshReport(force){
  if(rbusy)return;const sm=S.missions.find(x=>x.id===rid);if(!sm)return;
  const sig=JSON.stringify(sm);if(!force&&sig===rsig)return;rsig=sig;rbusy=true;
  try{const m=await api('missions/'+rid);if(m.error||rid!==m.id)return;
    $('rt').textContent=m.title;$('rg').textContent=`"${m.goal}"`+(m.context?` · with: ${m.context.title}`:'')+(m.schedule?` · repeats ${sched(m.schedule)}`:'')+(m.seenCount?` · ${m.seenCount} results remembered (only new ones are reported)`:'');
    let h='';const act=ACTIVE.includes(m.status);
    if(m.report)h+=`<div class="rep md">${md(m.report)}</div>`;else if(act)h+=`<p><b>${esc(m.phase||'Working...')}</b></p>`;else if(m.error)h+=`<p>Problem: ${esc(m.error)}</p>`;
    if(m.steps?.length)h+=`<div class="mute" style="margin-top:8px">What each agent did:</div>`+m.steps.map((s,i)=>{const c=S.cfg[s.agent]||{};

    const dx=x-c.userData.px[0],dz=z-c.userData.px[1];if(Math.hypot(dx,dz)>.002){c.rotation.y=turn(c.rotation.y,Math.atan2(dx,dz),dt*10);c.userData.px=[x,z];}
    c.position.set(x,.16+Math.abs(Math.sin(t*16))*.1,z);walkAnim(c,t,true,16);c.userData.s.position.y=1.05+Math.sin(t*6)*.05;}
  for(const id in couriers)if(!live.has(+id)){scene.remove(couriers[id]);delete couriers[id];}
  renderer.render(scene,cam);
}
document.fonts.load('600 16px Fredoka').finally(()=>frame());
</script></body></html>
